function getTranslation(key, lang = currentLang) {
    return translations[lang]?.[key] || translations['en']?.[key] || key;
}

function applyTranslations(language) {
    currentLang = language;
    document.documentElement.lang = language; 

    document.title = getTranslation('page_title');

    document.querySelectorAll('[data-translate-key]').forEach(element => {
        const key = element.getAttribute('data-translate-key');
        const translation = getTranslation(key);

        if (element.tagName === 'INPUT') {
            if (element.type === 'submit' || element.type === 'button') {
                element.value = translation;
            } else if (element.hasAttribute('placeholder')) {
                element.placeholder = translation;
            }
        } else if (element.tagName === 'TEXTAREA' && element.hasAttribute('placeholder')) {
             element.placeholder = translation;
        } else if (element.tagName === 'OPTION') { 
            // For select options, textContent is fine. The specific update for languageSelect options will handle their display names.
            // This generic OPTION case can be for other selects if they use data-translate-key on options directly.
            element.textContent = translation;
        }
        else {
            // Using textContent for most elements to avoid issues if a translation accidentally contains HTML.
            // If specific translations NEED HTML, use element.innerHTML = translation; and ensure those translation strings are safe.
            // For simplicity and security, textContent is safer by default.
            element.textContent = translation; 
        }
    });

    const languageSelect = document.getElementById('languageSelect');
    if (languageSelect) {
        Array.from(languageSelect.options).forEach(option => {
            if (option.value === 'en') option.text = getTranslation('lang_english');
            if (option.value === 'it') option.text = getTranslation('lang_italian');
            if (option.value === 'fr') option.text = getTranslation('lang_french');
            if (option.value === 'es') option.text = getTranslation('lang_spanish');
        });
        languageSelect.value = currentLang;
    }
    
    const userNameDisplay = document.getElementById('userNameDisplay');
    if (userNameDisplay && !userNameDisplay.hasAttribute('data-user-set')) { // Check this attribute after me()
        
    }
    
    // Check if specific page elements that need re-initialization are present
    if (typeof inizializzaGrafici === 'function' && document.getElementById('grafici-container')) {
        //inizializzaGrafici(); // It will use getTranslation for titles
    }
    // If dashboard content that needs specific text updates (not handled by data-translate-key) exists
    if (document.querySelector('.stats-wrapper')) {
        // For example, updateDashboardContent might need to be called,
        // or specific elements within it that are not covered by data-translate-key.
        // For now, assuming data-translate-keys cover static text.
        // Date text "Assente" / "Choose start date" should now be handled by data-translate-key.
    }
}

    function addNewTransaction() {
      const category = document.getElementById("new-category").value;
      const date = document.getElementById("new-dateT").value;
      const type = JSON.parse(document.getElementById("new-type").value);
      const amount = parseFloat(document.getElementById("new-amount").value);
      const description = document.getElementById("new-description").value;

      if (category.length > 20) {
        alert(getTranslation('alert_category_too_long'));
        return;
      }
      if (description.length > 100) {
        alert(getTranslation('alert_description_too_long'));
        return;
      }
      if (isNaN(amount) || amount > 99999999.99) {
        alert(getTranslation('alert_amount_invalid_or_large'));
        return;
      }

      const transaction = { category, date, type, amount, description };

      fetch("http://localhost:8080/transaction/add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify(transaction)
      })
        .then(res => {

            fetchTransactions();

        });
    }

    function loadPage(page, callback) {
	  me(); // Call me() to potentially set user name before loading new page content
      contentArea.classList.add('hidden');

      setTimeout(() => {
        fetch(page)
          .then((res) => (res.ok ? res.text() : Promise.reject('Failed to load page')))
          .then((html) => {
            contentArea.innerHTML = html;
            contentArea.classList.remove('hidden');
            applyTranslations(currentLang); // Apply translations to newly loaded content

            if (typeof callback === 'function') {
              callback();
            }
          })
          .catch((err) => {
            contentArea.innerHTML = `<p data-translate-key="error_loading_content_p">${getTranslation('error_loading_content_p')}</p>`;
            contentArea.classList.remove('hidden');
            console.error(err);
          });
      }, 200);
    }

    function animateContent(element, targetValue) {
      if (!element) return;
      const duration = 1000; 
      const increment = targetValue / (duration / 16); 
      let current = 0;
      const prefix = '€';
      const suffix = '';

      function updateContent() {
        current += increment;
        if (current >= targetValue) {
          element.textContent = `${prefix}${targetValue.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}${suffix}`;
        } else {
          element.textContent = `${prefix}${Math.floor(current).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}${suffix}`;
          requestAnimationFrame(updateContent);
        }
      }
      updateContent();
    }

    async function updateDashboardContent() {
      await fetchBudgetSummary();
      fetchTransactions(); // This fetches and populates the transaction table
      let weeklyRemaining = weeklyBudget - transactionsW;
      let monthlyRemaining = monthlyBudget - transactionsM;
      let annualRemaining = annualBudget - transactionsY;
		
      const avgWeekly = WDays > 0 ? transactionsW / WDays : 0;
      const avgMonthly = MDays > 0 ? transactionsM / MDays : 0;
      const avgAnnual = YDays > 0 ? transactionsY / YDays : 0;

      const budgetElements = {
        weekly: document.querySelector('#weeklyBudgetBox .animated-number:nth-child(1)'),
        monthly: document.querySelector('#monthlyBudgetBox .animated-number:nth-child(1)'),
        annual: document.querySelector('#annualBudgetBox .animated-number:nth-child(1)'),
      };
      const remainingElements = {
        weekly: document.querySelector('#weeklyBudgetBox .animated-number:nth-child(2)'),
        monthly: document.querySelector('#monthlyBudgetBox .animated-number:nth-child(2)'),
        annual: document.querySelector('#annualBudgetBox .animated-number:nth-child(2)'),
      };

      if (budgetElements.weekly && remainingElements.weekly) {
        animateContent(budgetElements.weekly, weeklyBudget);
        animateContent(remainingElements.weekly, weeklyRemaining);
      }
      if (budgetElements.monthly && remainingElements.monthly) {
        animateContent(budgetElements.monthly, monthlyBudget);
        animateContent(remainingElements.monthly, monthlyRemaining);
      }
      if (budgetElements.annual && remainingElements.annual) {
        animateContent(budgetElements.annual, annualBudget);
        animateContent(remainingElements.annual, annualRemaining);
      }

      const avgWeeklyElem = document.querySelector('span[data-period="week"]');
      const avgMonthlyElem = document.querySelector('span[data-period="month"]');
      const avgAnnualElem = document.querySelector('span[data-period="year"]');

      if (avgWeeklyElem) animateContent(avgWeeklyElem, avgWeekly);
      if (avgMonthlyElem) animateContent(avgMonthlyElem, avgMonthly);
      if (avgAnnualElem) animateContent(avgAnnualElem, avgAnnual);

      // The text content for these average elements will be numbers, so no direct translation needed for the numbers themselves.
      // Their labels are handled by data-translate-key.
       if (avgWeeklyElem) {
        avgWeeklyElem.setAttribute('data-target', avgWeekly.toFixed(2));
        // animateContent will set the textContent
      }
      if (avgMonthlyElem) {
        avgMonthlyElem.setAttribute('data-target', avgMonthly.toFixed(2));
      }
      if (avgAnnualElem) {
        avgAnnualElem.setAttribute('data-target', avgAnnual.toFixed(2));
      }
      // Update overall stats which are also numbers
      // The labels for overall stats are handled by data-translate-key
    }
    
    function handleBudgetEditForm(type) {
      const budgetForm = document.getElementById(`${type}-budget-edit-input-form`);
      const budgetInput = document.getElementById(`${type}BudgetInput`);

      if (budgetForm) {
        budgetForm.addEventListener('submit', (e) => {
          e.preventDefault(); 
          const newBudget = parseFloat(budgetInput.value); 

          if (isNaN(newBudget) || newBudget < 0 || newBudget > 99999999.99) {
            alert(getTranslation('alert_budget_invalid_or_large'));
            return;
          }
        
          if (!isNaN(newBudget) && newBudget >= 0) {
            if (type === 'weekly') {
              weeklyBudget = newBudget;
            } else if (type === 'monthly') {
              monthlyBudget = newBudget;
            } else if (type === 'annual') {
              annualBudget = newBudget;
            }

            updateBudget({
              week: weeklyBudget,
              month: monthlyBudget,
              year: annualBudget
            });
			
            updateDashboardContent(); 
            hideDiv(`${type}BudgetBoxEdit`); 
            showDiv(`${type}BudgetBox`); 
          } else {
            console.error('Invalid budget input');
          }
        });
      }
    }
